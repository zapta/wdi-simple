name: build-wdi-simple

on:
  workflow_dispatch:

env:
  WDK_URL: https://go.microsoft.com/fwlink/p/?LinkID=253170
  LIBUSB0_URL: https://github.com/mcuee/libusb-win32/releases/download/release_1.4.0.0/libusb-win32-bin-1.4.0.0.zip
  LIBUSBK_URL: https://github.com/mcuee/libusbk/releases/download/V3.1.0.0/libusbK-3.1.0.0-bin.7z

  # This env is set latter.
  RELEASE_TAG:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Get release and package tags
        uses: fpgawars/apio-workflows/.github/actions/get-release-and-package-tags@main
        with:
          release-tag-var: RELEASE_TAG
          package-tag-var: PACKAGE_TAG

      - name: Install msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            base-devel
            autotools
            git

      - name: Checkout pbatard/libwdi
        uses: actions/checkout@v5
        with:
          repository: pbatard/libwdi
          ref: v1.5.1
          submodules: recursive

      - name: Download WDK and helper drivers
        shell: cmd
        run: |
          curl -L %WDK_URL% -o wdk-redist.msi
          curl -L %LIBUSB0_URL% -o libusb0-redist.zip
          curl -L %LIBUSBK_URL% -o libusbk-redist.7z
          msiexec /a wdk-redist.msi /qn TARGETDIR=%CD%\wdk
          7z x libusb0-redist.zip
          7z x libusbk-redist.7z
          del /q *.zip *.7z
          move libusb-win32* libusb0
          move libusbK* libusbk
          dir libusbk\bin\sys\x86

      - name: Build examples
        run: |
          ./bootstrap.sh
          ./configure \
            --build=x86_64-w64-mingw32 \
            --host=x86_64-w64-mingw32 \
            --enable-examples-build \
            --disable-debug \
            --disable-shared \
            --disable-32bit \
            --with-wdkdir="wdk/Windows Kits/8.0" \
            --with-wdfver=1011 \
            --with-libusb0="libusb0" \
            --with-libusbk="libusbk/bin"
          make
          ls -l examples/*.exe

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: libwdi-examples
          path: |
            examples/wdi-simple.exe
            examples/zadig.exe

      - name: Prepare release text
        run: |
          cat  > RELEASE-BODY.txt <<EOF
          ### Zadig build
          EOF

          cat -n RELEASE-BODY.txt

      - name: Cleanup old pre-releases
        uses: fpgawars/apio-workflows/.github/actions/cleanup-old-prereleases@main

      - name: Ensure no conflicting release (again)
        uses: fpgawars/apio-workflows/.github/actions/ensure-no-conflicting-release@main
        with:
          release-tag: ${{ env.RELEASE_TAG }}

      - name: Create GitHub pre-release
        uses: fpgawars/apio-workflows/.github/actions/create-pre-release@main
        with:
          release_tag: ${{ env.RELEASE_TAG }}
          body_path: RELEASE-BODY.txt
          # We intensionally list explicitly all the expected files rather
          # then using file patterns.
          files: |
            examples/wdi-simple.exe
            examples/zadig.exe
